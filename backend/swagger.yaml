openapi: 3.0.3
info:
  title: CareCircle Backend API
  version: 1.0.0
servers:
  - url: http://localhost:3000/api
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        name:
          type: string
    AuthResponse:
      type: object
      properties:
        token:
          type: string
    CaseCreate:
      type: object
      required: [patientName, patientDob, emergencyContact]
      properties:
        patientName:
          type: string
        patientDob:
          type: string
          format: date
        emergencyContact:
          type: string
        dischargeNotes:
          type: string
    Case:
      type: object
      properties:
        id:
          type: string
        patientName:
          type: string
        patientDob:
          type: string
          format: date-time
        emergencyContact:
          type: string
        dischargeNotes:
          type: string
        coordinatorId:
          type: string
        consentGiven:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
paths:
  /auth/register:
    post:
      summary: Register a coordinator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /auth/login:
    post:
      summary: Login and receive JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /cases:
    post:
      summary: Create a new care case (coordinator only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseCreate'
      responses:
        '201':
          description: Case created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
    get:
      summary: List cases visible to the user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Array of cases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Case'
