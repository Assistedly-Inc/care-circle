name = "care-circle"
compatibility_date = "2024-01-01"
main = "src/edge-checkout.js"

routes = [
  # Custom domain at apex — provisioned automatically by `wrangler deploy`
  # (creates the Workers custom domain AND the DNS record for the zone).
  { pattern = "assistedly.ai", custom_domain = true, zone_id = "70904cb60620dcfb62f49cccbfe72959" },
]

[vars]
# Live Stripe price ($29/mo, 30-day free trial) — the Checkout Session is
# created at the edge (src/edge-checkout.js) before the HTML is returned.
STRIPE_PRICE_ID = "price_1URC9xApH5e5iOZ4vtS464J6"

[observability]
enabled = true

# Serve the Next.js static export (`npm run build` -> out/) as Workers static
# assets, but run the Worker script FIRST so /checkout can stream with an
# edge-generated session and routes get cache headers. Non-checkout routes
# fall through to env.ASSETS.fetch().
[assets]
directory = "out"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = true